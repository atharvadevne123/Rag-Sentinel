name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint with ruff
        run: ruff check . --select E,F,W,I --ignore E501
      - name: Format check with ruff
        run: ruff format --check .

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx pytest-cov
      - name: Run tests with coverage
        env:
          DATABASE_URL: sqlite:///./test.db
          MODEL_PATH: /tmp/test_model.joblib
          METRICS_PATH: /tmp/test_metrics.json
        run: |
          pytest tests/ -q --tb=short \
            --cov=app --cov=rag --cov=pipelines \
            --cov-report=term-missing \
            --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mypy and stubs
        run: pip install mypy fastapi pydantic sqlalchemy numpy scipy scikit-learn joblib
      - name: Run mypy
        run: mypy app/ rag/ --ignore-missing-imports --no-error-summary
        continue-on-error: true

  security:
    name: Security audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        run: pip-audit -r requirements.txt --skip-editable
        continue-on-error: true
